id: "@treeseed/ui"
name: TreeSeed UI
kind: node-typescript
type: ui-library
repository: treeseed-ai/ui
publishTarget: npm
capabilities: { save: true, verify: true, publish: true, deploy: false, localOnly: false }
workflowTemplateVersion: "1"
workflowDependencies: ["@treeseed/sdk"]
githubEnvironments:
  - production
requiredSecrets:
  - NPM_TOKEN
verify:
  fast: npm run verify
  local: npm run verify:direct
  release: npm run release:verify
artifacts:
  - provider: npm
    name: "@treeseed/ui"
releaseGate:
  workflow: verify.yml
development:
  schemaVersion: treeseed.development-runtime/v1
  project: { id: ui, repository: treeseed-ai/ui }
  defaults: { leaseSeconds: 14400, restoreOnFailure: true }
  targets:
    - id: package
      kind: package-watch
      platforms: [linux-amd64, linux-arm64, darwin-arm64, darwin-amd64]
      runtimeRequirements: [node>=22]
      sourceRoots: [src, scripts/development]
      ignoredPaths: [dist, node_modules]
      operations:
        watch: { command: node, args: [--watch-path=src, --watch-path=package.json, --import, tsx, scripts/development/build-watch.ts], environment: {}, timeoutSeconds: 86400 }
        build: { command: npm, args: [run, build], environment: {}, timeoutSeconds: 900 }
        verify: { command: npm, args: [run, test:unit], environment: {}, timeoutSeconds: 900 }
      ready: { kind: marker, path: dist/.treeseed-build-complete.json, timeoutSeconds: 120 }
      outputs: [{ path: dist, mediaType: application/vnd.treeseed.node-package, completionMarker: dist/.treeseed-build-complete.json, digestAlgorithm: sha256 }]
      endpoints: []
      dependencies: []
      statePolicy: stateless
      migrationPolicy: none
      secretRefs: {}
      shutdown: { graceSeconds: 10, activeWorkPolicy: block }
      resources: {}
      logs: [.treeseed/development/package.log]
      forbiddenOperations: [publish, production-tag]
      freeze:
        kind: npm-package
        operation: { command: npm, args: [pack, --json], environment: {}, timeoutSeconds: 900 }
        artifacts: [treeseed-ui-*.tgz]
        contractOperations: []
      promotion: { liveAdmissible: false, candidateRequiresVerification: true }
    - id: sandbox
      kind: live-web
      platforms: [linux-amd64, linux-arm64, darwin-arm64, darwin-amd64]
      runtimeRequirements: [node>=22, browser]
      sourceRoots: [src, sandbox]
      ignoredPaths: [dist, node_modules]
      operations:
        start: { command: npm, args: [run, dev, --, --host, 127.0.0.1, --port, "4321"], environment: {}, timeoutSeconds: 86400 }
        verify: { command: npm, args: [run, test:e2e], environment: {}, timeoutSeconds: 1800 }
      ready: { kind: http, path: /, expectedStatus: 200, timeoutSeconds: 120 }
      outputs: []
      endpoints: [{ id: http, protocol: http, port: 4321, visibility: loopback, authentication: none }]
      dependencies: [{ id: ui, target: package, locality: local, reaction: reload }]
      statePolicy: stateless
      migrationPolicy: none
      secretRefs: {}
      shutdown: { graceSeconds: 10, activeWorkPolicy: block }
      resources: {}
      logs: [.treeseed/development/sandbox.log]
      forbiddenOperations: [public-route]
      promotion: { liveAdmissible: false, candidateRequiresVerification: true }
standards:
  schemaVersion: 1
  workflow: { enabled: true }
  acceptedBaseline: { packageName: "@treeseed/ui", packageVersion: "0.12.17" }
  produced:
    - { id: "@treeseed/ui/typescript-public-api", family: typescript, version: "1.0.0", semanticRange: "^1.0.0", source: dist, artifact: .treeseed/standards/typescript-public-api.json, verifier: scripts/packages/release-verify.ts }
    - { id: "@treeseed/ui/presentation-catalog", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: src/astro, artifact: .treeseed/standards/presentation-catalog.json, verifier: scripts/packages/release-verify.ts }
  consumed: []
  guarantees: [accessible-presentation-only, deterministic-contract-bundle, semantic-version-sufficiency]
  deprecations: []
  runtimes: [browser, astro>=5]
  rollbackOperations: [remove-prerelease-dist-tag, restore-accepted-composition]
projectArchitecture:
  topology: split_site_content
  rootPath: .
  sitePath: docs
  contentPath: src/content
  contentRuntimeSource: r2_preview_overlay
  localContentMaterialization: none
  contentPublishTarget:
    kind: cloudflare_r2
    prefix: packages/ui
