name: Cordis UI verification
on:
  pull_request:
    branches: [cordis]
  push:
    branches: ['feature/**', 'fix/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Use official Ubuntu archive for bounded browser prerequisites
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
      - run: bun node_modules/playwright/cli.js install --with-deps firefox
      - name: Read exact UI replacement fixture source
        run: git fetch --no-tags --depth=1 origin 4bc3511b661e832531c60ab37980fed6dcc8aba6
      - run: bun run verify
